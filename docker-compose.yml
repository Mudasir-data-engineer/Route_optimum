services:
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      - db
    restart: always
    networks:
      - routeopt-network

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    restart: always
    networks:
      - routeopt-network

  db:
    image: postgis/postgis:14-3.2
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: routeoptimum
      POSTGRES_USER: routeuser
      POSTGRES_PASSWORD: routepass
    ports:
      - "5432:5432"
    restart: always
    networks:
      - routeopt-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@routeopt.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - routeopt-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - routeopt-network

  # 🧩 Airflow Webserver
  airflow-webserver:
    build: ./Docker/airflow
    restart: always
    depends_on:
      - airflow-scheduler
      - db
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://routeuser:routepass@db:5432/routeoptimum
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__WEBSERVER__SECRET_KEY=cfc7fbc2650c46aab1978a66a436298b
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
    ports:
      - "8080:8080"
    volumes:
      - ./Docker/airflow/dags:/opt/airflow/dags
      - ./etl/src:/opt/airflow/etl
    networks:
      - routeopt-network
    command: webserver

  # 🧠 Airflow Scheduler
  airflow-scheduler:
    build: ./Docker/airflow
    restart: always
    depends_on:
      - db
    volumes:
      - ./Docker/airflow/dags:/opt/airflow/dags
      - ./etl/src:/opt/airflow/etl
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://routeuser:routepass@db:5432/routeoptimum
      - AIRFLOW__WEBSERVER__SECRET_KEY=cfc7fbc2650c46aab1978a66a436298b
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
    networks:
      - routeopt-network
    command: scheduler


  # 🐘 Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - routeopt-network

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - routeopt-network

volumes:
  pgdata:
  pgadmin_data:

networks:
  routeopt-network:
    driver: bridge
